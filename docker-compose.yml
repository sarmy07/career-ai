services:
  app:
    build: .
    container_name: career_ai
    ports:
      - '3000:3000'
    env_file:
      - .env
    depends_on:
      - postgres:
          conditon: service_healthy

  postgres:
    image: postgres:16-alpine
    container_name: career_ai_postgres
    environment:
      - POSTGRES_USER=${DB_USERNAME}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME}
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  volumes:
    postgres_data:
